<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nos vidéos</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/nv-192.png">
<link rel="apple-touch-icon" href="icons/nv-180.png">
<!-- MyWorld_1.55 (+ 1.56 : vidéos Facebook non lisibles repérées) : mini-appli « Nos vidéos » d'Alessia (étape 5 de « Vidéos à deux », maquette « Mini-appli Vidéos d'Alessia »).
     Même liste commune que My World (Firestore shared/videos/items), même connexion Google, installable à part
     (son propre manifeste, son scope /my_world/videos/ et son partage « Partager → Nos vidéos »).
     Qui a le droit : décidé par les règles Firestore (2 comptes), aucune adresse ici. -->
<style>
@font-face{font-family:Nunito;font-weight:400;font-display:swap;src:url(../fonts/nunito-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:600;font-display:swap;src:url(../fonts/nunito-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:700;font-display:swap;src:url(../fonts/nunito-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:800;font-display:swap;src:url(../fonts/nunito-latin-800-normal.woff2) format("woff2")}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#FFFFFF;color:#14202B;font-family:Nunito,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
a{color:#0B4F7C}
button{font:inherit;cursor:pointer}
.nv-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 12px}
.nv-top h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.3px}
.nv-top p{margin:2px 0 0;font-size:13px;color:#4A5A68}
.nv-mw{flex:none;height:44px;padding:0 14px;border-radius:22px;border:1px solid #C9D6E0;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;text-decoration:none;color:#0B4F7C;background:#FFFFFF}
.nv-msg{margin:4px 16px 12px;padding:12px 14px;border-radius:14px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;line-height:1.35}
.nv-msg.ok{background:#E7F4EC;color:#1F5E36}
.nv-msg.info{background:#EAF1F6;color:#0B4F7C}
.nv-msg.warn{background:#FBEFD2;color:#6E4A0A}
.nv-msg svg{flex:none}
.nv-msg span{flex:1}
.nv-msg button{flex:none;border:0;background:none;color:inherit;font-weight:800;text-decoration:underline;padding:6px 2px}
.nv-inst{margin:0 16px 12px;padding:12px 14px;border-radius:14px;border:1px solid #E5C9D6;display:flex;align-items:center;gap:12px;font-size:13px;line-height:1.35;color:#4A2034}
.nv-inst span{flex:1}
.nv-inst button{flex:none;height:38px;padding:0 14px;border-radius:19px;border:0;background:#B23C6E;color:#FFFFFF;font-weight:800}
.vd-tabs{display:flex;gap:8px;margin:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.vd-tabs button{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid #D9E1E8;background:#FFFFFF;color:#14202B;font-size:13px;font-weight:700}
.vd-tabs button.on{background:#B23C6E;border-color:#B23C6E;color:#FFFFFF}
.nv-page{padding:0 16px 150px}
.vd-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 8px}
.vd-cell{display:flex;flex-direction:column;gap:5px;min-width:0;padding:0;border:0;background:none;text-align:left;color:#14202B;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.vd-cell:active .vd-th{transform:scale(.96)}
.vd-th{position:relative;display:block;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#DDE3EA;transition:transform .15s}
.vd-th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vd-ph{position:absolute;inset:0;display:grid;place-items:center;opacity:.7}
.vd-ph svg{width:34px;height:34px}
.vd-pb{position:absolute;top:6px;left:6px;height:20px;padding:0 6px;border-radius:10px;color:#FFFFFF;font-size:10px;font-weight:800;display:inline-flex;align-items:center}
.vd-pb.s{position:static;flex:none}
.vd-new{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:#F2614E;border:2px solid #FFFFFF}
.vd-who{position:absolute;bottom:6px;left:6px;display:flex}
.vd-who i{width:22px;height:22px;border-radius:50%;color:#FFFFFF;font-size:11px;font-weight:800;font-style:normal;display:grid;place-items:center;border:1.5px solid #FFFFFF}
.vd-who i+i{margin-left:-7px}
.vd-dur{position:absolute;bottom:7px;right:6px;font-size:10px;font-weight:700;color:#FFFFFF;background:#14202BCC;padding:2px 5px;border-radius:6px}
.vd-heart{position:absolute;top:30px;right:7px;color:#FF6B81;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.vd-cell small{font-size:11.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nv-empty{margin:28px 8px;text-align:center;font-size:14px;line-height:1.5;color:#4A5A68}
.nv-foot{margin:22px 0 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.nv-link{border:0;background:none;color:#B23C6E;font-size:14px;font-weight:800;padding:10px}
.vd-cred{margin:0;font-size:11px;color:#6A7884;text-align:center}
.nv-fade{position:fixed;left:0;right:0;bottom:0;height:120px;background:linear-gradient(to bottom,#FFFFFF00,#FFFFFF 45%);pointer-events:none;z-index:20}
.nv-go{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:21;height:54px;padding:0 26px;border-radius:27px;border:0;background:#B23C6E;color:#FFFFFF;font-size:16px;font-weight:800;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px #B23C6E55;white-space:nowrap}
.nv-go small{font-size:12px;font-weight:700;opacity:.8}
/* connexion */
.nv-gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center}
.nv-gate .lg{width:88px;height:88px;border-radius:24px}
.nv-gate h1{margin:6px 0 0;font-size:28px;font-weight:800}
.nv-gate p{margin:0;font-size:14px;line-height:1.5;color:#4A5A68;max-width:300px}
.nv-btn{height:50px;padding:0 24px;border-radius:25px;border:0;background:#B23C6E;color:#FFFFFF;font-size:15px;font-weight:800}
.nv-btn.light{background:#FFFFFF;color:#14202B;border:1px solid #C9D6E0}
.nv-gate .err{color:#A23A1F;font-weight:700}
/* fiche du bas */
.nv-scrim{position:fixed;inset:0;z-index:60;background:rgba(20,32,43,.42);display:flex;align-items:flex-end}
.nv-sheet{width:100%;background:#FFFFFF;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.nv-sheet h2{margin:0 0 10px;font-size:17px;font-weight:800;line-height:1.3}
.nv-sheet label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.nv-sheet input{width:100%;height:48px;border-radius:12px;border:1px solid #C9D6E0;padding:0 12px;font:inherit;font-size:15px}
.nv-sheet .hint{margin:8px 0 0;font-size:12.5px;color:#4A5A68}
.vd-btns{display:flex;gap:10px;margin-top:14px}.vd-btns .nv-btn{flex:1;padding:0 10px}
.vd-danger{color:#C2412D!important}
.vd-shm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0;font-size:13px;color:#4A5A68}
.vd-ext{display:block;margin-top:14px;text-align:center;font-size:14px;font-weight:700;color:#0B4F7C}
/* mode soirée (identique à My World) */
#vdRoot{position:fixed;inset:0;z-index:92}
#vdRoot *{box-sizing:border-box}
body.vd-on{overflow:hidden}
.vd-s{position:absolute;inset:0;background:#000000;color:#FFFFFF;overflow:hidden;touch-action:none}
.vd-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;touch-action:auto}
.vd-stage iframe,.vd-stage>div:not(.vd-nop):not(.vd-fin){width:100%;height:100%;border:0;display:block}
.vd-stage iframe.ig{background:#FFFFFF}
.vd-top{position:absolute;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 26px;background:linear-gradient(to bottom,rgba(0,0,0,.7),rgba(0,0,0,0));display:flex;flex-direction:column;gap:10px;pointer-events:none}
.vd-top *{pointer-events:auto}
.vd-segs{display:grid;gap:3px}
.vd-segs span{height:3px;border-radius:2px;background:rgba(255,255,255,.3)}
.vd-segs span.done{background:#FFFFFF}.vd-segs span.on{background:rgba(255,255,255,.8)}
.vd-tr{display:flex;align-items:center;justify-content:space-between}
.vd-tr span{font-size:14px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.vd-x{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#FFFFFF;display:grid;place-items:center}
.vd-side{position:absolute;z-index:2;right:12px;bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;align-items:center}
.vd-rb{width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#FFFFFF;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.vd-rb.heart{color:#FFB3BF}.vd-rb.laugh{color:#FFE2A6}
.vd-rb.heart.on{background:#FF6B81;color:#FFFFFF}.vd-rb.laugh.on{background:#FFD27A;color:#3A2A08}
.vd-rb.on{transform:scale(1.06)}
.vd-bot{position:absolute;left:0;right:0;bottom:0;padding:56px 80px calc(22px + env(safe-area-inset-bottom,0px)) 16px;background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,0));display:flex;flex-direction:column;gap:7px}
.vd-by{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.vd-av{width:28px;height:28px;border-radius:50%;border:1.5px solid #FFFFFF;font-size:13px;font-weight:800;display:grid;place-items:center}
.vd-byn{font-size:13px;font-weight:700}.vd-byd{font-size:12px;color:#C9D2DA}
.vd-bt{margin:0;font-size:15px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vd-hint{margin:0;font-size:12px;color:#C9D2DA;display:flex;align-items:center;gap:6px}
.vd-nop,.vd-fin{padding:0 32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;color:#E6EBF0;font-size:15px;line-height:1.45}
.vd-fin-t{margin:0;font-size:24px;font-weight:800;color:#FFFFFF}
.vd-fin p,.vd-nop p{margin:0}
.vd-force{border:0;background:none;color:#C9D2DA;font-size:13.5px;font-weight:700;text-decoration:underline;padding:8px}
.vd-nop .nv-btn,.vd-fin .nv-btn{display:inline-flex;align-items:center;text-decoration:none}
</style>
</head>
<body>
<div id="gate" class="nv-gate" hidden>
  <img class="lg" src="icons/nv-192.png" alt="">
  <h1>Nos vidéos</h1>
  <p id="gateTx">Les vidéos à regarder ensemble, avec Théo et Alessia.</p>
  <p id="gateErr" class="err" role="alert"></p>
  <button type="button" class="nv-btn" id="gateBtn">Se connecter avec Google</button>
</div>
<div id="app" hidden></div>
<div id="vdRoot" hidden></div>
<div id="sheet" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
