<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>My World</title>
<meta name="theme-color" content="#0B4F7C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My World">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192-v2.png">
<link rel="apple-touch-icon" href="icons/icon-192-v2.png">
<style>
@font-face{font-family:Nunito;font-weight:400;font-display:swap;src:url(fonts/nunito-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:600;font-display:swap;src:url(fonts/nunito-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:800;font-display:swap;src:url(fonts/nunito-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Dancing Script";font-weight:600;font-display:swap;src:url(fonts/dancing-script-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Dancing Script";font-weight:700;font-display:swap;src:url(fonts/dancing-script-latin-700-normal.woff2) format("woff2")}
/* Concept : un carnet aquarelle (bullet journal). Chaque mois a sa palette, son illustration de haut de page et deux illustrations peintes. Thème clair unique, assumé. */
:root{
  --paper:#FFFFFF; --dot:transparent; --ink:#26262C; --ink-soft:#5E5E68; --band:#EEEEF2; --line:#E6E6EC; --glow:transparent; --wash:transparent;
  --text:#26262C; --muted:#66666F; --card:#FFFFFF;
  --f-hand:"Nunito", "Segoe UI", system-ui, sans-serif;
  --f-body:"Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html,body{background:var(--paper);color:var(--text)}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
#paper{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle, var(--dot) 1.1px, transparent 1.4px);background-size:20px 20px}
#drift{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#app{position:relative;z-index:2;max-width:560px;min-height:100vh;margin:0 auto;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));overflow:hidden}
.wash{position:absolute;border-radius:50%;pointer-events:none;z-index:-1}
h1,h2,h3{margin:0;text-wrap:balance;color:var(--text)}
h2{font-family:var(--f-hand);font-weight:800;font-size:26px;line-height:1.1;letter-spacing:-.01em;color:var(--ink)}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
.gut{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft)}
.stk{position:absolute;pointer-events:none}

/* Écran de connexion */
#gate{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:var(--paper);background-image:radial-gradient(circle, var(--dot) 1.1px, transparent 1.4px);background-size:20px 20px}
#gate[hidden]{display:none}
#gate h1{font-family:var(--f-hand);font-weight:800;font-size:40px;letter-spacing:-.01em;line-height:1;color:var(--ink)}
#gate p{color:var(--muted);max-width:300px}
#gate .btn-ink{min-height:50px;padding:12px 22px;font-size:16px;display:flex;align-items:center;gap:10px}
body.locked #app,body.locked nav.tabs{visibility:hidden}
.gcal-btn{margin:8px 12px 4px;display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 24px);min-height:44px;border-radius:6px;border:1.5px dashed var(--ink);background:transparent;color:var(--ink);font-size:14px;font-weight:800}

/* Haut de page */
.hd{position:relative;container-type:inline-size;height:min(73.4vw,411px)}
.hd-img{position:absolute;left:-5.64cqw;top:0;width:111.3cqw;max-width:none;height:62.1cqw;object-fit:cover;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 100%);mask-image:linear-gradient(to bottom,#000 72%,transparent 100%)}
.hd-title{position:absolute;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.hd-title .halo{position:absolute;left:-26px;right:-26px;top:-16px;bottom:-18px;z-index:-1;border-radius:50%}
.mname{font-family:var(--f-hand);font-weight:800;line-height:1.05;letter-spacing:-.015em;color:var(--ink)}
.garland{display:flex;align-items:center;gap:6px;color:var(--ink);margin-top:2px}
.garland img{width:20px;height:20px}
.motto{margin-top:8px;font-size:11px;font-weight:800;letter-spacing:.13em;line-height:1.5;text-transform:uppercase;color:var(--ink-soft)}
.hd-greet{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;padding:0 60px}
.hd-greet p{font-size:17px;font-weight:700;color:var(--text);text-align:center}
.gear{position:absolute;right:max(14px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.85);display:grid;place-items:center;color:var(--ink)}
.hd-greet .gear{bottom:-10px}
.hd.small{height:auto;padding:calc(56px + env(safe-area-inset-top,0px)) 0 6px}
.hd.small .hd-img{height:44cqw;opacity:.42;-webkit-mask-image:linear-gradient(to bottom,#000 30%,transparent 100%);mask-image:linear-gradient(to bottom,#000 30%,transparent 100%)}
.hd.small .gear{top:calc(14px + env(safe-area-inset-top,0px))}
.hd-page{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.hd-page h1{font-family:var(--f-hand);font-weight:800;font-size:38px;line-height:1.1;letter-spacing:-.01em;color:var(--ink)}
.hd-page .halo{position:absolute;left:12%;right:12%;top:-18px;bottom:-14px;z-index:-1;border-radius:50%;background:radial-gradient(closest-side,var(--paper) 60%,transparent 100%)}
.hero-sub{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--ink-soft);margin-top:4px}

/* Mouvement */
@keyframes fall{0%{transform:translate(0,-40px) rotate(0);opacity:0}6%{opacity:.9}30%{transform:translate(-40px,30vh) rotate(140deg)}60%{transform:translate(20px,62vh) rotate(300deg)}94%{opacity:.85}100%{transform:translate(-24px,108vh) rotate(520deg);opacity:0}}
@keyframes rain{0%{transform:translate(0,-30px);opacity:0}10%{opacity:.6}100%{transform:translate(-30px,108vh);opacity:.4}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes burst{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
@keyframes micPulse{0%{box-shadow:0 0 0 0 rgba(224,64,94,.45)}100%{box-shadow:0 0 0 12px rgba(224,64,94,0)}}
@keyframes inFromRight{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes inFromLeft{from{transform:translateX(-36px);opacity:0}to{transform:none;opacity:1}}
html{overflow-x:hidden;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
*{-webkit-tap-highlight-color:transparent}
.slide-next>#hero,.slide-next>#captureZone,.slide-next>#view>:not(.fab){animation:inFromRight .26s cubic-bezier(.2,.7,.3,1)}
.slide-prev>#hero,.slide-prev>#captureZone,.slide-prev>#view>:not(.fab){animation:inFromLeft .26s cubic-bezier(.2,.7,.3,1)}
#splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:#FFFFFF;transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:116px;height:116px;border-radius:28px;box-shadow:0 14px 34px rgba(150,100,60,.22)}
#splash .spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(154,106,46,.18);border-top-color:#9A6A2E;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-mic{width:44px;height:44px;border-radius:14px;border:1.5px solid var(--line);background:#FFFFFF;color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.btn-mic[hidden]{display:none}
.btn-mic.on{background:#FCE3E8;border-color:#E0405E;color:#B02848;animation:micPulse 1.2s ease-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.4}}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-4px) rotate(var(--r,0deg))}}
.faller{position:absolute;top:0;animation:fall 18s linear infinite}
.faller.raindrop{animation-name:rain;animation-timing-function:linear}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.bob{animation:bob 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.faller,.pulse,.bob,.bar i,.slide-next>*,.slide-prev>*,.slide-next>#view>*,.slide-prev>#view>*,.btn-mic.on{animation:none!important}.faller{display:none}}

.settings-link{display:flex;justify-content:center;margin-top:18px}
.settings-link button{display:flex;align-items:center;gap:6px;min-height:40px;padding:8px 14px;border:0;background:transparent;color:#85858F;font-size:13px;font-weight:700}

/* Bulles */
.bubbles-wrap{margin-top:18px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bubbles-wrap::-webkit-scrollbar{display:none}
.bubbles{display:flex;gap:8px;width:max-content;padding-block:2px}
.bubble{display:flex;align-items:center;gap:6px;min-height:42px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.85);font-size:14px;font-weight:700;color:var(--text);white-space:nowrap}
.bubble .ct{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--band);color:var(--ink);font-size:12px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.bubble[aria-pressed="true"]{border-color:var(--ink);background:var(--band);color:var(--ink);font-weight:800}
.bubble[aria-pressed="true"] .ct{background:var(--ink);color:#FFFFFF}

/* Saisie */
.capture{position:relative;margin-top:16px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;border-radius:18px;background:rgba(255,255,255,.92);border:1.5px solid var(--line);box-shadow:0 10px 24px rgba(30,30,45,.10)}
.capture input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:10px 0;outline:none;color:var(--text)}
.capture input::placeholder{color:#85858F}
.btn-add{width:44px;height:44px;border-radius:14px;border:0;background:var(--ink);display:grid;place-items:center;flex-shrink:0}
.btn-add[disabled]{opacity:.6}
.capture-hint{margin-top:8px;font-size:13px;color:var(--muted);padding-inline:6px}
.capture-hint:empty{display:none}
.capture-hint strong{color:var(--text)}

/* Cartes et sections */
.card{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:6px;box-shadow:0 12px 28px rgba(30,30,45,.10)}
.section{position:relative;margin-top:38px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vine{color:var(--ink)}
.link-btn{border:0;background:none;padding:8px 0;font-size:14px;font-weight:800;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.soft-empty{padding:16px 18px;font-size:14px;color:var(--muted)}
.soft-empty b{color:var(--text)}
.solo>.section:first-child{margin-top:30px}

/* Briefing */
.brief-card{position:relative;margin-top:30px;padding:20px 20px 22px}
.brief-card.with-img{margin-top:84px}
.brief-head{display:flex;align-items:baseline;gap:10px}
.brief-head h2{font-size:34px}
.brief-head span{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.brief{margin-top:12px;font-size:16px;line-height:1.55;color:var(--text)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tag{padding:5px 11px;border-radius:999px;font-size:12px;font-weight:800;background:var(--band);color:var(--ink)}
.brief-img{position:absolute;right:-14px;transform:rotate(3deg)}

/* Semaine */
.week{margin-top:12px;padding:4px 0}
.day{padding:0 12px 10px}
.dband{margin-top:8px;display:flex;justify-content:space-between;align-items:center;padding:3px 10px;border-radius:3px;background:var(--band)}
.dband span{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text);font-variant-numeric:tabular-nums}
.day.today .dband{background:var(--ink)}
.day.today .dband span{color:#FFFFFF}
.day.past .dband,.day.past .ev{opacity:.5}
.ev{display:flex;align-items:baseline;gap:8px;padding:7px 4px 0}
.ev-body{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ev-edit{align-self:center;flex-shrink:0;box-sizing:border-box;width:38px;height:38px;margin:-6px -4px -6px 0;padding:0;border:0;border-radius:10px;background:transparent;color:var(--ink-soft);display:grid;place-items:center}
.ev-edit:active{background:var(--band)}
.ev-time{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ev::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink);flex-shrink:0;transform:translateY(-2px)}
.ev-t{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.ev-m{font-size:13px;color:var(--muted)}
.empty-day{display:flex;gap:6px;padding:9px 4px 0}
.empty-day i{width:4px;height:4px;border-radius:50%;background:var(--line)}
.pill-todo{padding:4px 10px;border-radius:999px;border:1.5px dashed var(--ink);background:transparent;color:var(--ink);font-size:12px;font-weight:800;min-height:32px}
.notice{padding:12px 14px;margin:8px 12px 4px;border-radius:4px;background:var(--band);font-size:13px;color:var(--text)}

/* Quête */
.quest{position:relative;padding:20px 20px 22px;display:flex;flex-direction:column;gap:12px}
.quest-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.quest h3{font-size:17px;font-weight:800;margin-top:8px}
.quest h2{font-size:34px}
.quest .meta{font-size:13px;color:var(--muted);margin-top:2px}
.xp{flex-shrink:0;width:62px;height:62px;border-radius:50%;border:2px dashed var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);color:var(--ink)}
.xp b{font-family:var(--f-hand);font-weight:700;font-size:22px;line-height:1}
.xp span{font-size:10px;font-weight:800;letter-spacing:.1em}
.step{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:10px 12px;border:0;border-radius:4px;background:var(--band);text-align:left;font-size:15px;font-weight:800;color:var(--text)}
.box{width:20px;height:20px;border:2px solid var(--ink);border-radius:4px;background:#FFFFFF;flex-shrink:0;display:grid;place-items:center}
.step.done{background:transparent;color:var(--muted);text-decoration:line-through;font-weight:700}
.step.done .box{background:var(--ink)}
.later{display:flex;flex-direction:column;gap:8px}
.later div{display:flex;align-items:center;gap:12px;padding:0 12px;font-size:14px;color:var(--muted)}
.later div::before{content:"";width:16px;height:16px;border:1.5px solid var(--line);border-radius:3px;flex-shrink:0}
.qtools{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mini{border:0;background:none;font-size:13px;font-weight:800;color:var(--muted);padding:8px 0;min-height:40px}
.qlist{display:flex;flex-direction:column;gap:22px;margin-top:12px}

/* Liens */
.frame{position:relative;margin-top:46px;padding:26px 22px 22px}
.frame>.c{position:absolute;width:34px;height:34px;border-color:var(--ink);border-style:solid;border-width:0}
.c.tl{left:0;top:0;border-left-width:1.5px;border-top-width:1.5px}.c.tr{right:0;top:0;border-right-width:1.5px;border-top-width:1.5px}
.c.bl{left:0;bottom:0;border-left-width:1.5px;border-bottom-width:1.5px}.c.br{right:0;bottom:0;border-right-width:1.5px;border-bottom-width:1.5px}
.frame>h2{margin:-48px 0 0;text-align:center}
.frame>h2 span{padding:0 10px;background:var(--paper)}
.lrows{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.lrow{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--band);display:grid;place-items:center;font-family:var(--f-hand);font-weight:700;font-size:22px;color:var(--ink);flex-shrink:0}
.lrow .n{font-size:16px;font-weight:800}
.lrow .w{font-size:13px;color:var(--muted)}
.dotline{height:2px;background-image:radial-gradient(circle,var(--line) 1px,transparent 1.2px);background-size:8px 2px}
.btn-line{min-height:40px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-size:13px;font-weight:800;flex-shrink:0}
.btn-ink{min-height:44px;padding:9px 16px;border-radius:999px;border:0;background:var(--ink);color:#FFFFFF;font-size:14px;font-weight:800}

/* Anniversaires */
.bday{display:flex;align-items:center;gap:14px;padding:12px 10px 12px 14px;width:100%;box-sizing:border-box;border:0;background:transparent;text-align:left;font:inherit;color:inherit}
.bday>div{flex:1;min-width:0}
.bday .edit{margin-left:auto;flex-shrink:0;box-sizing:border-box;width:44px;height:44px;padding:0;border:0;border-radius:12px;background:transparent;color:var(--ink-soft);display:grid;place-items:center}
.bday .edit:active{background:var(--band)}
.bday-more{display:block;width:100%;border:0;border-top:1px dashed var(--line);background:transparent;padding:12px;font-size:14px;font-weight:800;color:var(--ink)}
.bd-date{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px}
.bd-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.bd-actions .btn{box-sizing:border-box;height:48px;min-height:0}
.bday+.bday{border-top:1px dashed var(--line)}
.bday img{width:44px;height:44px;flex-shrink:0}
.bday .n{font-size:16px;font-weight:800}
.bday .w{font-size:13px;color:var(--muted)}
.foot{position:relative;margin-top:22px;display:flex;justify-content:center}

/* Fiche */
.who{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-top:4px}
.avatar-big{width:96px;height:96px;border-radius:50%;background:var(--band);border:2px dashed var(--ink);display:grid;place-items:center;font-family:var(--f-hand);font-weight:700;font-size:48px;color:var(--ink)}
.title-pill{padding:5px 14px;border-radius:999px;border:1.5px solid var(--ink);color:var(--ink);font-family:var(--f-hand);font-weight:700;font-size:20px;line-height:1.2}
.lvl{padding:18px 20px;display:flex;flex-direction:column;gap:10px;margin-top:26px}
.lvl-row{display:flex;justify-content:space-between;align-items:baseline}
.lvl-row b{font-family:var(--f-hand);font-weight:700;font-size:34px;color:var(--ink)}
.lvl-row span{font-size:14px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:999px;background:var(--band);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background-image:linear-gradient(90deg,var(--ink),var(--wash) 25%,var(--ink) 50%,var(--wash) 75%,var(--ink));background-size:200% 100%;animation:shimmer 5s linear infinite}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start;margin-top:12px}
.scol{display:flex;flex-direction:column;gap:12px}
.scol+.scol{margin-top:26px}
.stat{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:6px;border:1.5px solid transparent;text-align:left;min-width:0;box-shadow:0 10px 22px rgba(30,30,45,.10)}
.stat .top{display:flex;justify-content:space-between;align-items:center}
.stat .lv{font-family:var(--f-hand);font-size:32px;font-weight:700;line-height:1}
.stat .k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.stat .nm{font-size:15px;font-weight:800}
.sbar{height:6px;border-radius:999px;background:rgba(255,255,255,.7)}
.sbar i{display:block;height:100%;border-radius:999px}
.s-force{background:#E3D3F7;color:#2E2340} .s-force .k,.s-force .lv{color:#6640A6} .s-force .sbar i{background:#6640A6}
.s-dex{background:#FDDCC6;color:#3A2416} .s-dex .k,.s-dex .lv{color:#AA4A1C} .s-dex .sbar i{background:#AA4A1C}

}

/* aperçu de ce que l'appli a compris, avant d'enregistrer */
.cap-prev{scroll-margin-bottom:calc(110px + env(safe-area-inset-bottom,0px));scroll-margin-top:12px;margin-top:12px;padding:14px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);box-shadow:0 10px 24px rgba(30,30,45,.10);display:flex;flex-direction:column;gap:12px;animation:cpIn .32s cubic-bezier(.16,1,.3,1)}

.cp-eyebrow{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cp-kinds{display:flex;flex-wrap:wrap;gap:6px}
.cp-kinds button{min-height:38px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:#FFFFFF;font-size:13px;font-weight:800;color:var(--text)}

.cp-f{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}

.cap-prev .field input{height:44px}

.cp-learned{font-size:12px;font-weight:700;color:var(--ink)}
.learn-sub{font-size:13px;font-weight:800;color:var(--muted);margin:12px 0 4px}

/* Semaine : dates en colonne + rendez-vous en couleur par domaine */
:root{--c-sport:#E3D3F7;--c-sport-ink:#6640A6;--c-sante:#D4EED6;--c-sante-ink:#2F7440;--c-famille:#FAD3CB;--c-famille-ink:#A8402F;--c-admin:#FBE6B4;--c-admin-ink:#8E6312;--c-rappel:#D2E8FA;--c-rappel-ink:#2C679C;--c-boulot:#D9DFF7;--c-boulot-ink:#33449A;--c-projets:#FDDCC6;--c-projets-ink:#AA4A1C;--c-maison:#E6EDC8;--c-maison-ink:#56661A;--c-neutre:#FFFFFF;--c-neutre-ink:#66666F}
.week2{margin-top:12px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:12px}

.wday.today .wdate b::after{content:"";display:block;width:18px;height:3px;border-radius:2px;background:var(--ink);margin:4px auto 0}
.wday.free{align-items:center}
.wday.free .wdate b{color:var(--muted)}
.wfree{margin:0;font-size:14px;font-weight:700;color:var(--muted)}
.wtoday{margin:0 0 6px 2px;font-size:12px;font-weight:800;color:var(--ink)}
.wevs{display:flex;flex-direction:column;gap:8px;min-width:0}
.wev{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:10px;border:0;border-radius:14px;text-align:left;font:inherit;color:inherit}
button.wev:active{filter:brightness(.97)}
.wic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.65)}
.wtx{min-width:0;display:flex;flex-direction:column}
.wt{font-weight:800;font-size:14.5px;line-height:1.3;color:var(--text);overflow-wrap:anywhere}
.wmeta{font-size:12.5px;font-weight:700;margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 10px}
.wmeta .pin{display:inline-flex;align-items:center;gap:4px}
.wtm{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;line-height:1.2;color:var(--text);white-space:nowrap}
.wtm small{display:block;font-size:11px;font-weight:700;opacity:.75}
.k-sport{background:var(--c-sport);color:var(--c-sport-ink)} .k-sante{background:var(--c-sante);color:var(--c-sante-ink)} .k-famille{background:var(--c-famille);color:var(--c-famille-ink)} .k-admin{background:var(--c-admin);color:var(--c-admin-ink)} .k-rappel{background:var(--c-rappel);color:var(--c-rappel-ink)} .k-boulot{background:var(--c-boulot);color:var(--c-boulot-ink)} .k-projets{background:var(--c-projets);color:var(--c-projets-ink)} .k-maison{background:var(--c-maison);color:var(--c-maison-ink)} .k-neutre{background:var(--c-neutre);color:var(--c-neutre-ink);outline:1.5px dashed #C4C4CC;outline-offset:-1.5px}
.k-neutre .wic{background:var(--paper)}
.wlegend{display:flex;flex-wrap:wrap;gap:6px}

.wev .pill-todo{justify-self:end}

.mpanel .wevs{margin-top:8px}

/* ---------- refonte : style de l'agenda partout ---------- */
.qic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex-shrink:0}
.sec-date{font-size:13px;font-weight:800;color:var(--ink)}
.day2{margin-top:12px;padding:16px 14px;position:relative;display:flex;flex-direction:column}
.day2 .fil{position:absolute;left:79px;top:24px;bottom:28px;width:2px;background:var(--line);border-radius:2px}
.dstep{display:grid;grid-template-columns:52px 18px minmax(0,1fr);gap:8px;align-items:start;padding-bottom:16px}
.dstep:last-child{padding-bottom:0}
.dstep .dl{text-align:right;padding-top:1px;font-size:12.5px;font-weight:700;color:var(--muted)}

.dstep .dot{width:12px;height:12px;border-radius:50%;background:#FFFFFF;border:2.5px solid var(--line);position:relative;z-index:1;margin-top:3px;box-sizing:content-box}
.dstep .dt{display:block;font-size:14.5px;font-weight:800;line-height:1.3;color:var(--text)}
.dstep .ds{display:block;font-size:12.5px;font-weight:700;color:var(--muted)}
.dstep .ds button{border:0;background:none;padding:0 0 0 2px;font:inherit;font-weight:800;text-decoration:underline;text-underline-offset:2px}
.quest2{margin-top:12px;padding:14px;display:flex;flex-direction:column;gap:10px}

.step2{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;border:0;background:transparent;font:inherit;text-align:left;font-size:14.5px;font-weight:700;color:var(--text);min-height:44px}
.step2.next{background:var(--paper);font-weight:800}
.step2.done{color:#85858F;text-decoration:line-through}

.step2 .hint{margin-left:auto;font-size:12px;font-weight:800;color:var(--muted);text-decoration:none}
.qsum{margin:10px 0 0;font-size:14px;font-weight:800;color:var(--muted);text-align:center}
.qsum b{color:var(--ink)}
.qchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.qchip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:#FFFFFF;font-size:13.5px;font-weight:800;color:var(--text)}
.qchip[aria-pressed="true"]{background:var(--band);border-color:var(--ink);color:var(--ink)}
.qchip i{width:10px;height:10px;border-radius:50%}
.qdone{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:14px;background:#FBE6B4;color:#8E6312}
.qdone .ic2{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.7)}
.bd2{margin-top:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.bd2row{display:grid;grid-template-columns:44px minmax(0,1fr) 40px;gap:12px;align-items:center}
.bd2row+.bd2row{padding-top:12px;border-top:1.5px solid var(--line)}
.bd2row .date{text-align:center;line-height:1}
.bd2row .date small{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bd2row .date b{display:block;font-size:24px;font-weight:800;margin-top:3px}
.bd2row.near .date small,.bd2row.near .sub{color:#A8402F}
.bd2row .nm{display:block;font-size:15px;font-weight:800}
.bd2row .sub{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
.bd2row .edit{width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--ink-soft);display:grid;place-items:center}
.me{margin:0 18px;padding:16px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center}
.me-av{width:64px;height:64px;border-radius:20px;background:var(--ink);color:#FFFFFF;display:grid;place-items:center;font-size:30px;font-weight:800}
.me .bar{height:8px;background:#ECECF0}
.me .bar i{background:var(--ink);animation:none}
.stat{border-radius:16px;border:0;box-shadow:none}
.stat .lv{font-family:var(--f-hand);font-weight:800;font-size:26px}
.exrow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center}
.exrow+.exrow{padding-top:12px;border-top:1.5px solid var(--line)}
.exrow .date{text-align:center;line-height:1}
.exrow .date small{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.exrow .date b{display:block;font-size:22px;font-weight:800;margin-top:3px}
.excard{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:14px;background:#FFFFFF}
.excard .t{font-size:14.5px;font-weight:800;color:var(--text);line-height:1.3}
.excard .m{font-size:12.5px;font-weight:700}
.gcard{margin-top:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.gth{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center}

.gth span{font-size:12px;font-weight:800;color:var(--muted)}
.gart{display:flex;flex-direction:column;gap:3px;padding:10px 10px 10px 54px;border-radius:12px;text-decoration:none;color:var(--text)}

.gart .src{font-size:12.5px;font-weight:700;color:var(--muted)}
.gnew{display:inline-flex;align-self:flex-start;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;background:#D2E8FA;color:#2C679C;font-size:11px;font-weight:800;margin-bottom:2px}
.gnew i{width:6px;height:6px;border-radius:50%;background:#2C679C}

/* ===== Nouvelle direction (Planner_0.3) : blanc, anthracite, couleurs des domaines ===== */
#paper,#drift,#washes,.stk,.brief-img,.garland,.hd-img{display:none!important}
.hd,.hd.small{height:auto!important;padding:calc(26px + env(safe-area-inset-top,0px)) 0 14px!important}
.hd2{position:relative}
.hd2 .eb{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hd2 h1{font-family:var(--f-hand);font-size:31px;font-weight:800;letter-spacing:-.015em;line-height:1.1;margin-top:4px;color:var(--text);padding-right:56px}
.hd2 .sub{display:flex;align-items:center;font-size:13.5px;font-weight:700;color:var(--muted);margin-top:5px}
.hd2 .av{position:absolute;right:max(18px,env(safe-area-inset-right,0px));top:2px;width:44px;height:44px;border-radius:50%;background:#FFFFFF;border:1.5px solid var(--line);box-shadow:0 6px 16px rgba(30,30,45,.06);display:grid;place-items:center;font-weight:800;font-size:17px;color:var(--text);text-decoration:none}
.brief-card.with-img{margin-top:30px}
.card{border-radius:18px}
nav.tabs .in{background:rgba(255,255,255,.97)!important;border-top:1px solid var(--line)!important;box-shadow:0 -6px 20px rgba(30,30,45,.05)}

/* Accueil : bandeau de la semaine et programme */
.wstrip-sec{margin-top:14px}
.wsh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.wsh>span:first-child{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wsnavs{display:flex;gap:6px}.wsnav{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:#FFFFFF;display:grid;place-items:center;color:var(--text);padding:0}.wsnav:disabled{opacity:.35}
.wstrip{display:flex;justify-content:space-between;gap:2px;background:#FFFFFF;border:1px solid var(--line);border-radius:20px;padding:7px;box-shadow:0 6px 18px rgba(30,30,45,.04)}
.wsd{flex:1;min-width:0;max-width:52px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;border:0;border-radius:14px;background:transparent;color:var(--text)}
.wsd small{font-size:11px;font-weight:800;color:var(--muted)}.wsd b{font-size:17px;font-weight:800;line-height:1.2}
.wsd .pts{display:flex;gap:2px;height:5px;margin-top:2px}.wsd .pts i{width:5px;height:5px;border-radius:50%}
.wsd.past b,.wsd.past small{opacity:.45}
.wsd.today:not(.on) b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.wsd.on{background:#26262C;color:#FFFFFF}.wsd.on small{color:rgba(255,255,255,.8)}.wsd.on .pts i{box-shadow:0 0 0 1.5px #26262C}
.prows{display:flex;flex-direction:column;gap:9px;margin-top:2px}
.prow{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:10px 14px 10px 10px;border-radius:18px;background:#FFFFFF;border:1px solid var(--line);box-shadow:0 4px 14px rgba(30,30,45,.04);text-align:left;color:var(--text);font:inherit}
button.prow:active{transform:scale(.99)}
.prow.empty{padding:14px 16px}
.pri{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.prt{flex:1;min-width:0}.prt b{display:block;font-size:15px;font-weight:800;line-height:1.25}.prt em{display:block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prm{flex:none;font-size:12.5px;font-weight:800;color:var(--muted)}
.prbtn{flex:none;padding:6px 11px;border-radius:999px;background:#26262C;color:#FFFFFF;font-size:12px;font-weight:800;cursor:pointer}
.prow.done .prt b{text-decoration:line-through;color:#A9A9B2}.prow.done .pri{opacity:.55}
/* Fiche d'un rendez-vous */
#evRoot{position:fixed;inset:0;z-index:40;display:flex;justify-content:center;background:rgba(25,25,35,.25)}
#evRoot[hidden]{display:none}
body.evp-on{overflow:hidden}
.evp.still{animation:none}.evp{position:relative;width:100%;max-width:560px;height:100%;overflow:auto;background:var(--paper);animation:pop .28s ease-out}
.evp-top{position:relative;min-height:300px;padding:calc(18px + env(safe-area-inset-top,0px)) 24px 86px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.evp-bar{position:absolute;left:18px;right:18px;top:calc(16px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between}
.evp-round{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.7);color:inherit;display:grid;place-items:center;padding:0}
.evp-top small{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.evp-top h1{font-family:var(--f-hand);font-size:33px;font-weight:800;line-height:1.08;color:#26262C}
.evp-top p{display:flex;align-items:center;gap:5px;font-size:14.5px;font-weight:800}
.evp-sheet{position:relative;margin-top:-56px;background:var(--paper);border-radius:0 56px 0 0;padding:24px 22px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;min-height:calc(100% - 244px);box-sizing:border-box}
.evp-pills{display:flex;flex-wrap:wrap;gap:8px 18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.evp-pills span{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:var(--text)}
.evp-sheet h3{font-size:17px;font-weight:800;margin-top:4px;color:var(--text)}
.evp-desc{font-size:14.5px;font-weight:600;line-height:1.55;color:var(--muted);white-space:pre-line}
.evp-rem{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#FFFFFF;border:1px solid var(--line)}
.evp-rem b{display:block;font-size:14.5px;font-weight:800}.evp-rem em{display:block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--muted)}
.evp-ri{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#D2E8FA;color:#2C679C;flex:none}
.evp-act{margin-top:auto;padding-top:18px;display:flex;gap:10px}
.evp-ghost,.evp-go{flex:1;min-height:52px;border-radius:999px;font-size:15.5px;font-weight:800}
.evp-ghost{border:1px solid var(--line);background:#FFFFFF;color:var(--text)}
.evp-go{flex:1.3;border:0;background:#26262C;color:#FFFFFF;box-shadow:0 10px 20px rgba(30,30,45,.18)}.evp-go.is-done{background:#D4EED6;color:#2F7440;box-shadow:none}

/* Planner_0.5 : fond blanc pur, cartes détachées par un contour et une ombre douce */
.prow,.wstrip,.card{border-color:#EAEAF0!important;box-shadow:0 6px 20px rgba(30,30,45,.06)!important}
nav.tabs .in{background:#FFFFFF!important}

/* Planner_0.6 : bandeau bleu d'eau en haut, qui se fond dans le blanc */
html{background:linear-gradient(180deg,rgba(218,241,242,1.000) 0px,rgba(218,241,242,0.863) 57px,rgba(218,241,242,0.733) 113px,rgba(218,241,242,0.613) 170px,rgba(218,241,242,0.502) 227px,rgba(218,241,242,0.400) 283px,rgba(218,241,242,0.308) 340px,rgba(218,241,242,0.226) 397px,rgba(218,241,242,0.154) 453px,rgba(218,241,242,0.095) 510px,rgba(218,241,242,0.048) 567px,rgba(218,241,242,0.015) 623px,rgba(218,241,242,0.000) 680px) no-repeat,#FFFFFF!important}
body{background:transparent!important}

/* Planner_0.8 : bouton + au milieu et panneau d'ajout */
nav.tabs .in{grid-template-columns:repeat(2,calc((100% - 64px) / 4)) 64px repeat(3,calc((100% - 64px) / 6))!important;align-items:center}

.nav-add{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#addRoot{position:fixed;inset:0;z-index:45}

/* MyWorld_0.2 : ambiance Riviera. Grand bandeau bleu Méditerranée, texte blanc, semaine qui flotte dessus */
html{background:#F5F8FB!important}
:root{--ink:#0B3A5C;--text:#10263D;--muted:#5B6B7C;--line:#E1E8EF}

.hd2 h1{color:#FFFFFF!important}
.hd2 .av{background:rgba(255,255,255,.18)!important;border-color:rgba(255,255,255,.5)!important;color:#FFFFFF!important;box-shadow:none!important}
.wsh>span:first-child{color:rgba(255,255,255,.85)!important}
.wsnav{background:rgba(255,255,255,.18)!important;border-color:rgba(255,255,255,.4)!important;color:#FFFFFF!important}
.wstrip{box-shadow:0 14px 30px rgba(11,58,92,.18)!important;border-color:transparent!important}
.wsd.on{background:#0B4F7C!important}.wsd.on .pts i{box-shadow:0 0 0 1.5px #0B4F7C}
.prbtn,.btn-ink{background:#0B4F7C!important}
.nav-add{background:linear-gradient(160deg,#0B4F7C,#1F8FCB)!important;border-color:#FFFFFF!important}
body[data-view="accueil"] .hd2 h1{font-size:26px!important}

.fab{background:#0B4F7C!important}
.prow,.card{border-color:#E6ECF2!important;box-shadow:0 6px 20px rgba(11,58,92,.06)!important}
nav.tabs a[aria-current="page"]{background:#E4F1FA!important;color:#0B3A5C!important}
/* MyWorld_0.23 : Météo */
body[data-view="meteo"] #app::before{height:calc(var(--mtH,250px) + 8px)}
.mt-place{display:inline-flex;align-items:center;gap:6px;margin-top:8px;min-height:36px;padding:5px 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:13.5px;font-weight:800;cursor:pointer}

.mt-now{display:flex;align-items:center;gap:12px;margin-top:12px;color:#fff}
.mt-now .deg{font-size:52px;font-weight:900;line-height:.95;letter-spacing:-.03em}
.mt-now .d{display:flex;flex-direction:column;gap:2px;font-size:13.5px;font-weight:700;color:rgba(255,255,255,.88);margin-left:auto;text-align:right}
.mt-now .d b{font-size:16px;font-weight:900;color:#fff}
.mt{display:flex;flex-direction:column;gap:14px;margin-top:22px;padding-bottom:30px}
.mt-parts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt-part{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid #E6ECF2;border-radius:18px;box-shadow:0 6px 20px rgba(11,58,92,.06);padding:12px 14px}

.mt-part .top{display:flex;justify-content:space-between;align-items:center}
.mt-part .top b{font-size:24px;font-weight:900;color:#1E2530}
.mt-part .x{font-size:13px;font-weight:700;color:#5B6B7C}

.mt-alert .mtic{flex:none}
.mt-week{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:#fff;border:1px solid #E6ECF2;border-radius:18px;box-shadow:0 6px 20px rgba(11,58,92,.06);padding:12px 8px}
.mt-week>div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:800;color:#5B6B7C;padding:4px 0;border-radius:12px}

.mt-week>div i{font-style:normal;color:#2F7FC1;font-size:11.5px;font-weight:900}
.mt-week>div.bad{background:#FCE9DC}
.mt-credit{margin:0;text-align:center;font-size:12px;font-weight:700;color:#85858F}.mt-credit a{color:inherit}
.mt-retry{align-self:center}
.mt-res{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.mt-hit{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;font:inherit;padding:12px 14px;border-radius:14px;border:1.5px solid #E1E8EF;background:#fff;cursor:pointer}
.mt-hit b{font-size:15.5px;font-weight:800;color:#1E2530}.mt-hit span{font-size:13px;font-weight:700;color:#5B6B7C}
.mt-msg{margin:0;font-size:14px;font-weight:700;color:#5B6B7C}
.mt-home{display:flex;flex-direction:column;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid #E1E8EF;font-size:14px;font-weight:700;color:#5B6B7C}
.mt-home .btn{align-self:flex-start}
/* MyWorld_0.24 : pastille météo de l'accueil (à la place du T) */
body[data-view="accueil"] .hd2 h1{padding-right:122px}
.wpill{position:absolute;right:max(18px,env(safe-area-inset-right,0px));top:0;width:108px;height:50px;padding:0;overflow:hidden;border-radius:18px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.4);color:#fff;font:inherit;cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;transition:background .3s,border-color .3s,color .3s,transform .15s}

.wpill.tm .wp-p{color:#2F7FC1}
.wpill.empty{display:grid;place-items:center}.wp-dots{font-size:22px;font-weight:900;letter-spacing:2px;opacity:.7}
@media (prefers-reduced-motion: reduce){.wp-track,.wpill{transition:none}}
/* MyWorld_0.10 : barre Accueil · Notes · + · Apps, et éventail des apps */

.nav-apps{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border:0;background:transparent;border-radius:14px;color:var(--muted);font:inherit;font-size:11.5px;font-weight:700;justify-self:center;width:50%;min-width:64px;cursor:pointer;-webkit-tap-highlight-color:transparent}

.fan{position:absolute;inset:0;pointer-events:none}
.fan-app{position:absolute;pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:5px;width:84px;margin:-28px 0 0 -42px;padding:0;border:0;background:none;font:inherit;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;
  opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2);transition:transform .26s cubic-bezier(.34,1.45,.64,1),opacity .12s ease;transition-delay:calc(var(--i) * 16ms)}

#appsFan.off .fan-app{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2);transition:transform .24s cubic-bezier(.5,0,.75,0),opacity .2s ease .06s;transition-delay:calc((5 - var(--i)) * 22ms)}

/* MyWorld_0.13 : page « Tes listes » */

function compressImage(file){

        var d = c.toDataURL("image/jpeg", tries[i][1]);

    };

var REC = null;
function startRecording(){
  if (!navigator.mediaDevices || !window.MediaRecorder){ toast("L'enregistrement audio n'est pas disponible sur ce téléphone."); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var type = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find(function(t){ return MediaRecorder.isTypeSupported(t); }) || "";
    var mr = new MediaRecorder(stream, type ? {mimeType:type, audioBitsPerSecond:24000} : {audioBitsPerSecond:24000}), chunks = [], t0 = Date.now();
    REC = {mr:mr, stream:stream, t0:t0, cancel:false, tick:null};
    mr.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      var r = REC; REC = null; clearInterval(r && r.tick); nePop(null);
      if (!r || r.cancel || !NE) return;
      var dur = (Date.now() - r.t0) / 1000; if (dur < 0.8) return;
      var blob = new Blob(chunks, {type: mr.mimeType || "audio/webm"}), fr = new FileReader(), noteId = NE.note._id;

      fr.readAsDataURL(blob);
    };

    nePop('<div class="ne-rec"><span class="rec-dot" aria-hidden="true"></span><span id="recT">0:00</span><span style="flex:1;font-size:13px;color:var(--muted)">Enregistrement… (3 min max)</span><button type="button" class="btn light" data-act="rec-cancel">Annuler</button><button type="button" class="btn green" data-act="rec-stop">Terminer</button></div>');
    REC.tick = setInterval(function(){ var s = (Date.now() - t0) / 1000, e = document.getElementById("recT"); if (e) e.textContent = fmtDur(s); if (s >= 180) stopRecording(false); }, 250);

}

    case "note-restore": db.collection("notes").doc(id).update({deleted:false, deletedAt:null}).then(function(){ toast("Note restaurée."); setTimeout(trashSheet, 200); }).catch(dbErr); return true;
    case "note-purge": var pn = S.notes.find(function(n){ return n._id === id; }); if (pn) purgeNote(pn).then(function(){ setTimeout(trashSheet, 200); }).catch(dbErr); return true;

    case "note-del": db.collection("notes").doc(id).update({deleted:true, deletedAt:nowISO()}).then(function(){ closeSheet(); toast("Note supprimée.", {undo:function(){ db.collection("notes").doc(id).update({deleted:false, deletedAt:null}).catch(dbErr); }}); }).catch(dbErr); return true;

    case "folder-ren": var old = b.dataset.f, nv = prompt("Nouveau nom du dossier", old); if (!nv || !nv.trim() || nv.trim() === old) return true; nv = cap(nv.trim());

function splitImported(title, text){
  text = String(text || "").replace(/\r\n?/g, "\n").replace(/ /g, " ").replace(/^\s+|\s+$/g, "");
  title = String(title || "").trim();
  var lines = text.split("\n");
  if (title && normS(title) === normS(lines[0] || "")) lines.shift();
  if (!title && lines.length > 1 && lines[0].trim().length <= 60) title = lines.shift().trim();
  if (!title && lines.length === 1 && lines[0].length <= 40){ title = lines[0]; lines = []; }
  return {title:cap(title), text:lines.join("\n").replace(/^\s+|\s+$/g, "")};
}

  {k:"reglages", n:"Réglages", bg:"#ECEDF1", ink:"#3E4250", ic:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>'},
  {k:"meteo", n:"Météo", bg:"#D2E8FA", ink:"#2C679C", ic:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.5A3.3 3.3 0 0 0 7 18z"/></svg>'},
  {k:"drive", n:"Drive", bg:"#D4EED6", ink:"#2F7440", ic:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>', soon:true}
];
/* place de chaque app autour du bouton : [rayon en px, angle en degrés] (2 arcs de 3) */
var FAN_SPOTS = [[124,95],[124,135],[124,172],[228,102],[228,128],[228,154]];
var fanTimer = null;
function fanOpen(){
  var root = document.getElementById("appsFan"), fan = root.querySelector(".fan"), btn = document.querySelector(".nav-apps");
  if (!root.hidden && root.classList.contains("on")) return;
  clearTimeout(fanTimer);
  var gazNew = !document.getElementById("gazBadge").hidden;
  fan.innerHTML = FAN_APPS.map(function(a, i){
    return '<button type="button" class="fan-app' + (a.soon ? " soon" : "") + '" data-act="fan-go" data-app="' + a.k + '" style="--bg:' + a.bg + ';--ink:' + a.ink + ';--i:' + i + '"'
      + (a.soon ? ' aria-label="' + a.n + ', bientôt disponible"' : (a.k === "gazette" && gazNew ? ' aria-label="Gazette, nouveautés"' : "")) + '>'
      + '<span class="fi">' + a.ic + (a.k === "gazette" && gazNew ? '<i class="nbadge"></i>' : "") + '</span><b>' + a.n + '</b>' + (a.soon ? '<small>Bientôt</small>' : "") + '</button>';
  }).join("");
  var r = btn.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  /* l'arc démarre au-dessus du bouton ; il se resserre sur un écran étroit */
  var k = Math.min(1, (cx - 20) / 250);
  fan.querySelectorAll(".fan-app").forEach(function(t, i){
    var ang = FAN_SPOTS[i][1] * Math.PI / 180, R = FAN_SPOTS[i][0] * (i < 3 ? 1 : k);
    var x = cx + R * Math.cos(ang), y = (cy - 86) - R * Math.sin(ang);
    t.style.left = x + "px"; t.style.top = y + "px";
    t.style.setProperty("--dx", (cx - x) + "px"); t.style.setProperty("--dy", (cy - y) + "px");
  });
  root.hidden = false; document.body.classList.add("fan-on");
  btn.setAttribute("aria-expanded", "true"); btn.setAttribute("aria-label", "Fermer les apps");
  requestAnimationFrame(function(){ root.offsetWidth; root.classList.add("on"); });
  setTimeout(function(){ var f = fan.querySelector(".fan-app"); if (f) f.focus({preventScroll:true}); }, 60);
}
function fanClose(then){
  var root = document.getElementById("appsFan"), btn = document.querySelector(".nav-apps");
  if (root.hidden){ if (then) then(); return; }
  root.classList.remove("on"); root.classList.add("off");
  btn.setAttribute("aria-expanded", "false"); btn.setAttribute("aria-label", "Toutes les apps");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  clearTimeout(fanTimer);
  fanTimer = setTimeout(function(){ root.hidden = true; root.classList.remove("off"); document.body.classList.remove("fan-on"); root.querySelector(".fan").innerHTML = ""; if (then) then(); }, reduce ? 0 : 300);
  if (!then) btn.focus({preventScroll:true});
}
function fanGo(k){
  var a = FAN_APPS.filter(function(x){ return x.k === k; })[0];
  if (!a) return;
  if (a.soon){ toast(a.n + " arrive bientôt dans My World."); return; }
  fanClose(function(){
    if (k === "reglages") openSheet("Réglages", settingsHTML(), mountSettings);
    else location.hash = k;
  });
}
document.addEventListener("keydown", function(e){
  var root = document.getElementById("appsFan");
  if (root.hidden) return;
  if (e.key === "Escape"){ e.preventDefault(); fanClose(); return; }
  if (e.key === "Tab"){ /* le focus reste dans l'éventail */
    var b = root.querySelectorAll(".fan-app"); if (!b.length) return;
    var f = b[0], l = b[b.length-1];
    if (e.shiftKey && document.activeElement === f){ e.preventDefault(); l.focus(); }
    else if (!e.shiftKey && document.activeElement === l){ e.preventDefault(); f.focus(); }
  }
});
window.addEventListener("resize", function(){ if (!document.getElementById("appsFan").hidden) fanClose(); });

/* Navigation (MyWorld_0.12) : Accueil et Notes sont côte à côte (barre) ; les autres pages sont des apps
   ouvertes depuis l'éventail. S.hist garde le chemin parcouru pour le retour. */
var MAIN = ["accueil","notes"];
S.hist = [];
function isApp(v){ return MAIN.indexOf(v) < 0; }
function goBack(){
  /* retour à la page d'où l'on vient ; sinon à l'accueil */
  if (S.hist.length > 1) history.back(); else { S.hist = []; location.replace("#accueil"); }
}
function navSide(dir){
  /* dir = 1 : vers la droite de la barre (Notes) ; -1 : vers la gauche ou retour */
  if (!isApp(S.view)){
    var i = MAIN.indexOf(S.view) + dir;
    if (i >= 0 && i < MAIN.length) location.hash = MAIN[i];
    return true;
  }
  if (dir < 0){ goBack(); return true; }
  return false;
}
function route(){
  var hsh = (location.hash || "").replace("#",""), prev = S.view, prevKey = S.viewKey;
  var gd = hsh.match(/^gazette-(\d{4}-\d{2}-\d{2})$/);
  S.gzDay = gd ? gd[1] : null;
  S.view = gd ? "gazette" : TABS.indexOf(hsh) >= 0 ? hsh : "accueil";
  S.viewKey = gd ? hsh : S.view;
  var back = S.hist.length > 1 && S.hist[S.hist.length - 2] === S.viewKey;
  if (back) S.hist.pop(); else if (S.hist[S.hist.length - 1] !== S.viewKey) S.hist.push(S.viewKey);
  render(); window.scrollTo(0,0);
  if (prevKey && prevKey !== S.viewKey){
    var fwd = isApp(S.view) && !isApp(prev) ? true : !isApp(S.view) && !isApp(prev) ? MAIN.indexOf(S.view) > MAIN.indexOf(prev) : !back;
    if (S.view === "gazette" && prev === "gazette") fwd = !!S.gzDay;
    var app = document.getElementById("app"), cls = fwd ? "slide-next" : "slide-prev";
    app.classList.remove("slide-next","slide-prev"); void app.offsetWidth; app.classList.add(cls);
    setTimeout(function(){ app.classList.remove(cls); }, 300);
  }
}
/* glisser : entre Accueil et Notes ; dans une app, glisser vers la droite = retour */
(function(){
  var x0 = null, y0 = 0, t0 = 0;
  document.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1 || document.querySelector(".sheet-wrap,.levelup,.note-editor,.draw-pad,#gzPop")) { x0 = null; return; }
    if (e.target.closest(".bubbles-wrap,.topics,input,select,textarea,.month,.ncard2")) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if (x0 === null) return;
    var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8 || Date.now() - t0 > 700) return;
    navSide(dx < 0 ? 1 : -1);
  }, {passive:true});
})();
/* ordinateur : flèches gauche / droite du clavier pour changer de page */
document.addEventListener("keydown", function(e){
  if ((e.key !== "ArrowLeft" && e.key !== "ArrowRight") || e.altKey || e.ctrlKey || e.metaKey) return;
  if (document.querySelector(".sheet-wrap,.levelup,.note-editor,.draw-pad")) return;
  var a = document.activeElement; if (a && (a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) return;
  if (!document.getElementById("appsFan").hidden) return;
  if (navSide(e.key === "ArrowRight" ? 1 : -1)) e.preventDefault();
});
/* ordinateur : la molette fait défiler les rangées de bulles horizontalement */
document.addEventListener("wheel", function(e){
  var w = e.target.closest && e.target.closest(".bubbles-wrap,.topics,.nfolders");
  if (!w || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  var sc = w.scrollWidth > w.clientWidth ? w : w.querySelector("*"); if (!sc || sc.scrollWidth <= sc.clientWidth) return;
  e.preventDefault(); sc.scrollLeft += e.deltaY;
}, {passive:false});
/* dictée vocale dans la barre d'ajout */
(function(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, btn = document.getElementById("micBtn");
  if (!SR || !btn) return;
  btn.hidden = false;
  var rec = null, input = document.getElementById("captureInput"), hint = document.getElementById("captureHint"), base = "", auto = false;
  function stop(){ if (hint.textContent === "Je t'écoute…") hint.textContent = ""; btn.classList.remove("on"); btn.setAttribute("aria-pressed","false"); btn.setAttribute("aria-label","Dicter"); rec = null; }
  /* renvoie true si l'écoute a démarré ; autoSend : la phrase dictée part seule à l'analyse */
  S.dictate = function(autoSend){
    if (rec){ rec.stop(); return true; }
    if (!navigator.onLine){ toast("La dictée a besoin d'internet. Tu peux écrire ta phrase."); return false; }
    auto = !!autoSend;
    rec = new SR(); rec.lang = "fr-FR"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    base = input.value ? input.value.replace(/\s+$/,"") + " " : "";
    rec.onresult = function(ev){ var txt = ""; for (var i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript; input.value = base + txt.trim(); };
    rec.onerror = function(ev){ var c = ev && ev.error; if (c === "not-allowed" || c === "service-not-allowed") toast("Autorise le micro pour cette appli dans les réglages de Chrome."); else if (c === "no-speech") toast("Je n'ai rien entendu. Réessaie."); else if (c !== "aborted") toast("La dictée n'a pas fonctionné. Réessaie."); stop(); };
    rec.onend = function(){ var had = rec !== null; stop(); if (had && auto && input.value.trim()){ auto = false; var f = document.getElementById("captureForm"); if (f.requestSubmit) f.requestSubmit(); else f.dispatchEvent(new Event("submit", {cancelable:true})); return; } if (had && input.value.trim()){ input.focus(); hint.innerHTML = "<strong>Vérifie, puis touche +</strong>"; setTimeout(function(){ if (hint.textContent === "Vérifie, puis touche +") hint.textContent = ""; }, 5000); } };
    try { rec.start(); btn.classList.add("on"); btn.setAttribute("aria-pressed","true"); btn.setAttribute("aria-label","Arrêter la dictée"); hint.textContent = "Je t'écoute…"; return true; }
    catch(e){ stop(); toast("La dictée n'a pas pu démarrer."); return false; }
  };
  btn.addEventListener("click", function(){ S.dictate(false); });
})();
window.addEventListener("hashchange", route);
/* bouton + : appui long (0,45 s) = saisie au clavier */
(function(){
  var b = document.querySelector(".nav-add"), t = null;
  if (!b) return;
  function cancel(){ if (t){ clearTimeout(t); t = null; } }
  b.addEventListener("pointerdown", function(){ cancel(); S.lpFired = false; t = setTimeout(function(){ t = null; S.lpFired = true; try { navigator.vibrate && navigator.vibrate(15); } catch(e){} addOpen("text"); }, 450); });
  ["pointerup","pointerleave","pointercancel"].forEach(function(ev){ b.addEventListener(ev, cancel); });
  b.addEventListener("contextmenu", function(e){ e.preventDefault(); });
})();

/* ---------- démarrage ---------- */
function snap(col, key, order){
  var ref = db.collection(col); if (order) ref = ref.orderBy(order[0], order[1]).limit(order[2]);
  ref.onSnapshot(function(s){ S[key] = s.docs.map(function(d){ var o = Object.assign({}, d.data()); o._id = d.id; return o; }); if (key === "notes") S.notesLoaded = true; S.dbState = "ok"; render(); if (key === "items" || key === "notes") markReady(key); }, function(e){ if (e && e.code === "revoked"){ S.dbState = "off"; render(); } });
}
applyMonth(); route();
setInterval(render, 600000);

var readyParts = {items:0, notes:0, settings:0}, readySent = false;
function markReady(k){ readyParts[k] = 1; if (!readySent && readyParts.items && readyParts.notes && readyParts.settings){ readySent = true; window.dispatchEvent(new Event("carnet-ready")); } }
/* Partage depuis une autre appli (ex. Notes Xiaomi → Partager → My World) : la note arrive dans tes notes */
(function(){
  try {
    var q = new URLSearchParams(location.search);
    if (!q.has("share_text") && !q.has("share_title") && !q.has("share_url")) return;
    S.pendingShare = {title:(q.get("share_title") || "").trim(), text:(q.get("share_text") || "").trim(), url:(q.get("share_url") || "").trim()};
    history.replaceState(null, "", location.pathname + "#notes");
  } catch(e){}
})();
function processShare(){
  var sh = S.pendingShare; if (!sh || !db) return; S.pendingShare = null;
  var text = sh.text.replace(/\r\n?/g, "\n");
  if (sh.url && text.indexOf(sh.url) < 0) text = (text ? text + "\n" : "") + sh.url;
  var title = sh.title, lines = text.split("\n");
  if (title && normS(title) === normS(lines[0] || "")) lines.shift();
  if (!title && lines.length > 1 && lines[0].trim().length <= 60){ title = lines.shift().trim(); }
  var body = lines.join("\n").replace(/^\s+|\s+$/g, "");
  if (!title && !body) { toast("Rien à importer dans ce partage."); return; }
  location.hash = "notes";
  commit({kind:"note", title:cap(title), text:body, items:[]});
}
window.addEventListener("carnet-ready", function(){ setTimeout(processShare, 300); });
window.startData = function(dbApi, calApi){
  db = dbApi; mcp = calApi;
  snap("items","items"); snap("log","log"); snap("gazette","gazette",["addedAt","desc",80]); snap("notes","notes");
  db.doc("settings/main").onSnapshot(function(s){ S.settings = s.exists ? s.data() : null; render(); markReady("settings"); }, function(){ markReady("settings"); });
  watchCal();
};
})();
