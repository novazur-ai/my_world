name: Mise en ligne

# À chaque modification poussée sur main, l'appli est publiée sur GitHub Pages
# avec un numéro de version unique dans sw.js : les téléphones se mettent à jour tout seuls.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Numéro de version unique
        run: |
          BUILD="$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/${BUILD}/" sw.js
          grep -n 'const VERSION' sw.js
      - name: Préparer le site (sans les fichiers techniques)
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'scripts' --exclude 'GUIDE.md' --exclude 'README.md' --exclude 'firestore.rules' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
