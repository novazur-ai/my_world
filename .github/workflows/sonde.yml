# Essai ponctuel de la Gazette sans Firebase (écrit scripts/sonde/gazette-essai.json).
name: Sonde des flux
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/gazette.mjs", ".github/workflows/sonde.yml"]
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/gazette.mjs
        env:
          ESSAI: "1"
          ESSAI_SUJETS: "Monde,France,Nice,Éco,Tech,Sport,rugby,aviation d'affaires,crypto"
      - name: Enregistrer le résultat
        run: |
          git config user.name "sonde-gazette"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/sonde/gazette-essai.json
          git commit -m "Sonde : essai de la Gazette" || echo "rien à enregistrer"
          git pull --rebase origin main && git push
