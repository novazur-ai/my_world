name: Sonde Gazette (temporaire)
on:
  push:
    branches: [main]
    paths: [".github/workflows/sonde.yml", "scripts/sonde/**"]
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - run: node scripts/sonde/g.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
          FORCE: "true"
          SONDE: "1"
