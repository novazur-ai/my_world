name: Sonde sources
on: { push: { paths: ["scripts/sonde/**"] }, workflow_dispatch: {} }
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: ESSAI=1 ESSAI_SUJETS="Crypto,Pokémon,Nice" node scripts/gazette.mjs && node scripts/sonde/sonde.mjs
